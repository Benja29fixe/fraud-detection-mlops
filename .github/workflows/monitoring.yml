
name: MLOps Monitoring

on:
  push:
    branches:
      - main

  workflow_dispatch:

  schedule:
    - cron: "0 7 * * *"

jobs:
  monitoring:
    runs-on: ubuntu-latest

    env:
      MONITORING_METRICS_PATH: monitoring/fixtures/performance_metrics_demo.csv

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas

      - name: Execute monitoring
        id: monitor
        run: |
          set +e
          python monitoring/alert_monitoring.py
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"

          if [ "$code" -eq 2 ]; then
            echo "::warning::ML model degradation detected"
            exit 0
          fi

          exit "$code"

      - name: Upload monitoring report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monitoring-report
          path: monitoring/reports/monitoring_alert.json
          if-no-files-found: error

      - name: Alert summary
        if: steps.monitor.outputs.exit_code == '2'
        run: |
          echo "## MLOps Alert" >> "$GITHUB_STEP_SUMMARY"
          echo "Model performance degradation detected." >> "$GITHUB_STEP_SUMMARY"
          echo "Check the monitoring-report artifact." >> "$GITHUB_STEP_SUMMARY"