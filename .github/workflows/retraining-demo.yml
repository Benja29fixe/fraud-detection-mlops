
name: XGBoost Synthetic Retraining Demo

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retraining-demo:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas pyarrow
          python -m pip install scikit-learn xgboost
          python -m pip install mlflow joblib

      - name: Generate synthetic transactions
        run: |
          python retraining/generate_synthetic_data.py

      - name: Train and evaluate XGBoost
        run: |
          python retraining/train_demo.py

      - name: Upload model artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-retraining-results
          path: |
            models/synthetic/
          if-no-files-found: error
