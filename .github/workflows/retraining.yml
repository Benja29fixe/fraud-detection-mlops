name: XGBoost Retraining

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retraining:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy pyarrow
          python -m pip install scikit-learn xgboost
          python -m pip install mlflow joblib

      - name: Check required files
        run: |
          test -f data/raw/creditcard.csv
          test -f models/fraud_model.joblib

      - name: Prepare retraining data
        run: |
          python retraining/prepare_retraining_data.py

      - name: Optimize classification threshold
        run: |
          python retraining/optimize_threshold.py

      - name: Evaluate candidate model
        run: |
          python retraining/evaluate_final.py

      - name: Validate candidate model
        run: |
          python retraining/validate_model.py

      - name: Upload model artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retraining-results
          path: |
            models/retraining/
          if-no-files-found: warn

      - name: Upload MLflow tracking data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-tracking
          path: |
            mlflow.db
            mlartifacts/
          if-no-files-found: warn